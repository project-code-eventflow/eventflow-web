    <style>
        * {

        body {

            justify-content: center;
            align-items: center;

        .container {

        /* Loading State */
        .loading {
            display: block;

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);

            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }

        .message {
            font-size: 18px;

        /* Store Selection UI */
        .store-selection {
            display: none;

        .store-selection.active {

        .logo {
            display: flex;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .store-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .store-button:active {
            transform: translateY(0);
        }
        
        .store-button svg {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }
        
        .store-button.playstore {
            background: #34A853;
            color: white;
        }
        
        .store-button.appstore {
            background: #000000;

        }

        }

<body>
    <div class="container">
        <!-- Loading State -->
        <div class="loading" id="loadingState">
            <div class="spinner"></div>
            <div class="message">Redirecting to store...</div>
        </div>

        <!-- Store Selection UI -->
        <div class="store-selection" id="storeSelection">
            <div class="logo">
                <img src="/favicon/android-chrome-192x192.png" alt="The Uniflow Logo" />
                <span class="logo-text">The Uniflow</span>
            </div>
            <div class="subtitle">Choose your store</div>
            
            <div class="store-buttons">
                <a href="https://play.google.com/store/apps/details?id=com.errnify.eventflow" 
                   class="store-button playstore"
                   id="playStoreBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
                    </svg>
                    Download on Google Play
                </a>
                
                <div class="or-divider">or</div>
                
                <a href="https://apps.apple.com/app/id6745550320" 
                   class="store-button appstore"
                   id="appStoreBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.71,19.5C17.88,20.74 17,21.95 15.66,21.97C14.32,22 13.89,21.18 12.37,21.18C10.84,21.18 10.37,21.95 9.1,22C7.79,22.05 6.8,20.68 5.96,19.47C4.25,17 2.94,12.45 4.7,9.39C5.57,7.87 7.13,6.91 8.82,6.88C10.1,6.86 11.32,7.75 12.11,7.75C12.89,7.75 14.37,6.68 15.92,6.84C16.57,6.87 18.39,7.1 19.56,8.82C19.47,8.88 17.39,10.1 17.41,12.63C17.44,15.65 20.06,16.66 20.09,16.67C20.06,16.74 19.67,18.11 18.71,19.5M13,3.5C13.73,2.67 14.94,2.04 15.94,2C16.07,3.17 15.6,4.35 14.9,5.19C14.21,6.04 13.07,6.7 11.95,6.61C11.8,5.46 12.36,4.26 13,3.5Z"/>
                    </svg>
                    Download on App Store
                </a>
            </div>
        </div>
    </div>

    <script>
        const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.errnify.eventflow';
        const appStoreUrl = 'https://apps.apple.com/app/id6745550320';

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const store = urlParams.get('store'); // 'playstore' or 'appstore'

        // Detect platform
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

        // Handle direct store parameter
        if (store === 'playstore') {
            // User clicked Play Store button
            window.location.href = playStoreUrl;
        } else if (store === 'appstore') {
            // User clicked App Store button
            window.location.href = appStoreUrl;
        } else {
            // No store parameter - auto-detect or show selection
            if (isAndroid) {
                // Android device - go to Play Store
                window.location.href = playStoreUrl;
            } else if (isIOS) {
                // iOS device - go to App Store
                window.location.href = appStoreUrl;
            } else {
                // Desktop or unknown - show store selection UI
                setTimeout(() => {
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('storeSelection').classList.add('active');
                }, 500);
            }
        }
    </script>
